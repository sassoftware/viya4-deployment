---
# This file contains the cert-manager setup tasks for the baseline role.
# Chart Repo URL: https://charts.jetstack.io/
# Container registry: quay.io
# Chart Source: https://github.com/cert-manager/cert-manager/tree/master/deploy/charts/cert-manager
# Purpose: Installs and manages cert-manager for TLS certificate management in Kubernetes.

# Fail fast with a clear message instead of letting the Helm install below fail with a cryptic
# ownership conflict. On AWS IPv6/dual-stack clusters, the IaC/Terraform provisioning process
# already installs its own cert-manager Helm release into the "kube-system" namespace (required
# for the AWS Load Balancer Controller's dualstack webhook certificates). Installing a second
# cert-manager release here would collide with that release's ownership of the same cluster-scoped
# resources (CRDs, ClusterRoles, webhooks), causing errors such as:
#   Error: Unable to continue with install: ClusterRole "cert-manager-cainjector" in namespace ""
#   exists and cannot be imported into the current release: invalid ownership metadata;
#   annotation validation error: key "meta.helm.sh/release-namespace" must equal "cert-manager":
#   current value is "kube-system"
- name: Fail fast if cert-manager is requested on an AWS IPv6 cluster
  ansible.builtin.fail:
    msg: >
      V4_CFG_TLS_GENERATOR=cert-manager is not supported on AWS IPv6/dual-stack clusters
      (V4_CFG_ENABLE_IPV6=true). The IaC/Terraform provisioning process already installs its own
      cert-manager release into the "kube-system" namespace for IPv6 clusters, and installing a
      second cert-manager release here will fail with a Helm ownership conflict. Set
      V4_CFG_TLS_GENERATOR: openssl in your ansible-vars.yaml instead. See
      docs/user/NetworkingConsiderations.md for details.
  when:
    - PROVIDER is defined
    - PROVIDER == "aws"
    - V4_CFG_ENABLE_IPV6 is defined
    - V4_CFG_ENABLE_IPV6 | bool
    - V4_CFG_TLS_GENERATOR is defined
    - V4_CFG_TLS_GENERATOR == 'cert-manager'
  tags:
    - install
    - update

# Deploy the cert-manager controller using Helm
- name: Deploy cert-manager
  kubernetes.core.helm:
    name: "{{ CERT_MANAGER_NAME }}"                   # Name of the Helm release
    namespace: "{{ CERT_MANAGER_NAMESPACE }}"         # Namespace for cert-manager
    chart_repo_url: "{{ CERT_MANAGER_CHART_URL }}"    # Helm chart repository URL
    chart_ref: "{{ CERT_MANAGER_CHART_NAME }}"        # Helm chart name
    chart_version: "{{ CERT_MANAGER_CHART_VERSION }}" # Chart version to deploy
    values: "{{ CERT_MANAGER_CONFIG }}"               # Custom values for the chart
    kubeconfig: "{{ KUBECONFIG }}"                    # Kubeconfig for cluster access
    create_namespace: true                            # Create namespace if it doesn't exist
    wait: true                                        # Wait for deployment to complete
  when:
    - V4_CFG_TLS_GENERATOR is defined                 # Only if TLS generator is defined
    - V4_CFG_TLS_GENERATOR == 'cert-manager'          # Only if cert-manager is the generator
  tags:
    - install
    - update

# Apply multi-zone HA distribution across cert-manager controller Deployments.
- name: Apply multi-zone HA for cert-manager Deployments
  include_tasks:
    file: multi-zone-helm-ha.yaml
  vars:
    baseline_ha_release_name: "{{ CERT_MANAGER_NAME }}"
    baseline_ha_namespace: "{{ CERT_MANAGER_NAMESPACE }}"
  when:
    - V4_CFG_TLS_GENERATOR is defined
    - V4_CFG_TLS_GENERATOR == 'cert-manager'
  tags:
    - install
    - update

# Remove the cert-manager Helm release
- name: Remove cert-manager
  kubernetes.core.helm:
    name: "{{ CERT_MANAGER_NAME }}"           # Name of the Helm release
    namespace: "{{ CERT_MANAGER_NAMESPACE }}" # Namespace for cert-manager
    kubeconfig: "{{ KUBECONFIG }}"            # Kubeconfig for cluster access
    wait: true                                # Wait for removal to complete
    values: "{{ CERT_MANAGER_CONFIG }}"       # Use the same values as install (for idempotency)
    state: absent                             # Ensure the release is removed
  tags:
    - uninstall

# Explicitly delete cert-manager CRDs that Helm keeps due to "helm.sh/resource-policy: keep".
# These CRDs (and their dependant resources) create AWS LoadBalancers that leave behind ENIs
# which block VPC deletion when the EKS cluster is destroyed.
- name: Remove cert-manager CRDs
  kubernetes.core.k8s:
    api_version: apiextensions.k8s.io/v1
    kind: CustomResourceDefinition
    name: "{{ item }}"
    state: absent
    wait: true
    kubeconfig: "{{ KUBECONFIG }}"
  loop:
    - challenges.acme.cert-manager.io
    - orders.acme.cert-manager.io
    - certificaterequests.cert-manager.io
    - certificates.cert-manager.io
    - clusterissuers.cert-manager.io
    - issuers.cert-manager.io
  ignore_errors: true   # CRD may not exist if cert-manager was never installed
  tags:
    - uninstall

# Remove the cert-manager namespace from the cluster
- name: Remove {{ CERT_MANAGER_NAMESPACE }} namespace
  kubernetes.core.k8s:
    api_version: v1                       # Kubernetes API version
    kind: Namespace                       # Resource kind
    name: "{{ CERT_MANAGER_NAMESPACE }}"  # Namespace to remove
    wait: true                            # Wait for deletion
    state: absent                         # Ensure the namespace is deleted
    kubeconfig: "{{ KUBECONFIG }}"        # Kubeconfig for cluster access
  tags:
    - uninstall
