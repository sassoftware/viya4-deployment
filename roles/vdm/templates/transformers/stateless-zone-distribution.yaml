# Transformer to set topology spread constraints for stateless services (Deployments)
# Targets ALL Deployments - no selector (will apply to all including non-SAS)
# labelSelector: {} (empty) matches all pods; matchLabelKeys narrows scope to each
# Deployment's own pods via pod-template-hash (auto-injected by Kubernetes on every ReplicaSet).
# This ensures each service's replicas are spread independently, not evaluated globally.
# Requires Kubernetes >= 1.27 (matchLabelKeys beta) / >= 1.29 (stable).
apiVersion: builtin
kind: PatchTransformer
metadata:
  name: stateless-zone-distribution
patch: |-
  - op: replace
    path: /spec/template/spec/topologySpreadConstraints
    value:
      - maxSkew: 1
        topologyKey: topology.kubernetes.io/zone
        whenUnsatisfiable: ScheduleAnyway
        labelSelector: {}
        matchLabelKeys:
          - pod-template-hash
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector: {}
        matchLabelKeys:
          - pod-template-hash
target:
  kind: Deployment
  version: v1
  group: apps

---
apiVersion: builtin
kind: PatchTransformer
metadata:
  name: centralized-zone-antiaffinity
patch: |-
  - op: replace
    path: /spec/template/spec/affinity/podAntiAffinity/preferredDuringSchedulingIgnoredDuringExecution/0/podAffinityTerm/topologyKey
    value: topology.kubernetes.io/zone
target:
  kind: Deployment
  group: apps
  version: v1
  labelSelector: workload.sas.com/class=stateless