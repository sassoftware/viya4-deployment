---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: ClientTrafficPolicy
metadata:
  name: {{ V4_CFG_GATEWAY_API_CLIENT_TRAFFIC_POLICY_NAME | default('enable-proxy-protocol') }}
  namespace: {{ V4_CFG_BASELINE_GATEWAY_NAMESPACE | default('envoy-gateway-system') }}
spec:
  enableProxyProtocol: true
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ V4_CFG_BASELINE_GATEWAY_NAME | default('k8s-gw') }}
  path:
    escapedSlashesAction: {{ V4_CFG_GATEWAY_API_ESCAPED_SLASHES_ACTION | default('KeepUnchanged') }}
